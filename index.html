<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0e27;
    overflow: hidden;
    font-family: 'Space Mono', monospace;
  }
  #world {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #151332 0%, #0a0e27 70%);
  }
  .star {
    position: absolute;
    width: 2px; height: 2px;
    background: #fff;
    image-rendering: pixelated;
    animation: twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  .planet {
    position: absolute;
    width: 172px; height: 172px;
    cursor: pointer;
    animation: drift 40s ease-in-out infinite;
  }
  .grad-cap {
    position: absolute;
    width: 52px; height: 40px;
    top: -20px; left: 48%;
    transform: translateX(-50%) rotate(-9deg);
    z-index: 4;
    pointer-events: none;
  }
  .grad-cap svg { width: 100%; height: 100%; shape-rendering: crispEdges; overflow: visible; }
  .planet.focused .grad-cap { transform: translateX(-50%) rotate(-9deg) scale(1.16); }
  .planet-svg {
    width: 100%; height: 100%;
    overflow: visible;
    display: block;
    filter: drop-shadow(0 0 18px rgba(255,255,255,0.10));
    transition: transform 0.25s ease-out;
  }
  /* slow, lazy wander — reads like a lowkey orbit, never fast */
  @keyframes drift {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(14px, -10px); }
    50%  { transform: translate(6px, 14px); }
    75%  { transform: translate(-12px, 4px); }
    100% { transform: translate(0, 0); }
  }
  /* proximity focus */
  .planet.focused, #socials.focused { z-index: 20; animation-play-state: paused; }
  .planet.focused .planet-svg, #socials.focused .planet-svg {
    animation: focus-pulse 1.5s ease-in-out infinite;
  }
  @keyframes focus-pulse {
    0%, 100% { transform: scale(1.16); filter: drop-shadow(0 0 14px rgba(255,255,255,0.30)); }
    50%      { transform: scale(1.22); filter: drop-shadow(0 0 32px rgba(255,255,255,0.55)); }
  }
  #focus-prompt {
    position: fixed;
    z-index: 40;
    transform: translate(-50%, -100%);
    display: none;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    line-height: 1.6;
    color: #0a0e27;
    background: #ffd580;
    border: 2px solid #fff;
    padding: 7px 10px;
    text-align: center;
    white-space: nowrap;
    box-shadow: 0 0 0 2px #0a0e27, 0 6px 0 rgba(0,0,0,0.35);
    animation: prompt-bob 1.1s ease-in-out infinite;
    pointer-events: none;
  }
  #focus-prompt.show { display: block; }
  #focus-prompt.below { transform: translate(-50%, 0); }
  #focus-prompt .key { color: #b23360; }
  body.touch #focus-prompt { pointer-events: auto; cursor: pointer; }
  @keyframes prompt-bob {
    0%, 100% { margin-top: 0; }
    50% { margin-top: -5px; }
  }
  /* floating decorations */
  #deco { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
  .deco { position: absolute; image-rendering: pixelated; }
  .deco svg { display: block; shape-rendering: crispEdges; overflow: visible; }
  .deco.spin-slow svg { animation: deco-rot 18s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes deco-rot { to { transform: rotate(360deg); } }
  @keyframes deco-drift {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(var(--dx, 16px), var(--dy, -12px)); }
  }
  .shoot {
    position: absolute;
    width: 2px; height: 2px;
    background: #fff;
    box-shadow: 0 0 6px 1px #fff;
    pointer-events: none;
    z-index: 2;
  }
  .shoot::after {
    content: '';
    position: absolute;
    right: 2px; top: 0;
    width: 60px; height: 2px;
    background: linear-gradient(to left, #ffffffcc, transparent);
  }
  .planet-label {
    position: absolute;
    bottom: -28px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: #fff;
    white-space: nowrap;
    text-shadow: 2px 2px 0 #000;
  }
  #education    { top: 7%;  left: 4%;  animation-duration: 38s; animation-delay: -4s; }
  #work         { top: 52%; left: 3%;  animation-duration: 46s; animation-delay: -20s; }
  #projects     { top: 9%;  left: 74%; animation-duration: 42s; animation-delay: -12s; }
  #hobbies      { top: 55%; left: 76%; animation-duration: 52s; animation-delay: -30s; }
  #volunteering { top: 72%; left: 20%; animation-duration: 48s; animation-delay: -16s; }
  #socials {
    position: absolute;
    top: 4%; left: 45%;
    width: 116px; height: 92px;
    cursor: pointer;
    animation: drift 34s ease-in-out -8s infinite;
  }
  #socials .planet-svg { filter: drop-shadow(0 0 10px rgba(120,200,255,0.18)); }
  #socials .dish-spin { animation: dish-spin 8s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes dish-spin { to { transform: rotate(360deg); } }
  #sun {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 380px; height: 380px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffe082, #ff9800);
    box-shadow: 0 0 150px rgba(255, 152, 0, 0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
    animation: sun-glow 5s ease-in-out infinite;
  }
  @keyframes sun-glow {
    0%, 100% { box-shadow: 0 0 130px rgba(255, 152, 0, 0.5); }
    50%      { box-shadow: 0 0 200px rgba(255, 152, 0, 0.7); }
  }
  #sun-hi {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: #7a3f00;
    margin-bottom: 14px;
  }
  #sun-name {
    font-family: 'Press Start 2P', monospace;
    font-size: 26px;
    line-height: 1.3;
    color: #2a1800;
  }
  #astronaut {
    position: absolute;
    width: 44px; height: 56px;
    z-index: 10;
    will-change: left, top;
  }
  #astro-inner {
    width: 100%; height: 100%;
    transition: transform 0.12s ease-out;
  }
  #astro-inner.face-left { transform: scaleX(-1); }
  #astro-sprite {
    width: 100%; height: 100%;
    shape-rendering: crispEdges;
    animation: astro-float 2.6s ease-in-out infinite;
  }
  @keyframes astro-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  #astro-sprite g { transform-box: fill-box; }
  /* idle limb sway */
  #astro-sprite .arm-l { transform-origin: top center; animation: sway-a 2.6s ease-in-out infinite; }
  #astro-sprite .arm-r { transform-origin: top center; animation: sway-b 2.6s ease-in-out infinite; }
  #astro-sprite .leg-l, #astro-sprite .leg-r { transform-origin: top center; }
  @keyframes sway-a { 0%,100% { transform: rotate(5deg); }  50% { transform: rotate(-3deg); } }
  @keyframes sway-b { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(3deg); } }
  /* walking */
  #astronaut.walk #astro-sprite { animation: astro-float 0.42s ease-in-out infinite; }
  #astronaut.walk .leg-l { animation: step-a 0.42s steps(1,end) infinite; }
  #astronaut.walk .leg-r { animation: step-b 0.42s steps(1,end) infinite; }
  #astronaut.walk .arm-l { animation: step-b 0.42s steps(1,end) infinite; }
  #astronaut.walk .arm-r { animation: step-a 0.42s steps(1,end) infinite; }
  @keyframes step-a { 0%,49% { transform: rotate(22deg); }  50%,100% { transform: rotate(-22deg); } }
  @keyframes step-b { 0%,49% { transform: rotate(-22deg); } 50%,100% { transform: rotate(22deg); } }
  .astro-jet { opacity: 0; transition: opacity 0.1s; }
  #astronaut.walk .astro-jet { opacity: 1; animation: flame 0.18s steps(1,end) infinite alternate; }
  @keyframes flame { from { transform: scaleY(0.6); } to { transform: scaleY(1.15); } }
  @media (prefers-reduced-motion: reduce) {
    #astro-sprite, #astronaut.walk #astro-sprite,
    #astro-sprite .arm-l, #astro-sprite .arm-r,
    #astronaut.walk .leg-l, #astronaut.walk .leg-r,
    #astronaut.walk .arm-l, #astronaut.walk .arm-r,
    .planet, #socials, .deco, .deco.spin-slow svg, .star { animation: none; }
  }

  #panel-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(5, 5, 20, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
  }
  #panel {
    position: relative;
    background: #151332;
    border: 3px solid #ffffff33;
    border-radius: 4px;
    max-width: min(480px, calc(100vw - 32px));
    width: 100%;
    min-width: 0;
    max-height: min(88vh, 100%);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 24px 24px 20px;
    color: #e8e8f0;
  }
  #panel-content {
    flex: 1 1 auto;
    min-width: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 10px;
    overflow-wrap: anywhere;
    word-break: break-word;
    scrollbar-width: thin;
    scrollbar-color: #ff6b9d rgba(255,255,255,0.10);
  }
  #panel-content::-webkit-scrollbar { width: 9px; }
  #panel-content::-webkit-scrollbar-track { background: rgba(255,255,255,0.08); border-radius: 5px; }
  #panel-content::-webkit-scrollbar-thumb { background: #ff6b9d; border-radius: 5px; border: 2px solid #151332; }
  #panel-content * { max-width: 100%; min-width: 0; }
  /* fade hint that there's more to scroll */
  #panel.has-scroll::after {
    content: '';
    position: absolute;
    left: 3px; right: 3px;
    bottom: 56px;
    height: 28px;
    background: linear-gradient(to top, #151332, rgba(21,19,50,0));
    pointer-events: none;
  }
  #panel-x {
    position: absolute;
    top: 8px; right: 8px;
    width: 30px; height: 30px;
    background: transparent;
    border: 2px solid #ffffff33;
    color: #e8e8f0;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    cursor: pointer;
    border-radius: 3px;
    z-index: 2;
  }
  #panel-x:hover { background: #ff6b9d; color: #151332; }
  #panel h2 {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    margin-bottom: 16px;
    color: #fff;
  }
  #panel p, #panel li {
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 8px;
  }
  #panel ul { padding-left: 18px; margin-bottom: 14px; }
  #panel .entry-title { font-weight: bold; color: #ffd580; margin-top: 14px; overflow-wrap: break-word; }
  #panel h2 + .entry-title { margin-top: 2px; }
  #panel a { color: #6be0d6; text-decoration: none; border-bottom: 1px dotted #6be0d6aa; word-break: break-word; }
  #panel a:hover { color: #fff; border-bottom-color: #fff; }
  #close-btn {
    margin-top: 16px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    background: #ff6b9d;
    color: #151332;
    border: none;
    padding: 12px 16px;
    cursor: pointer;
    border-radius: 3px;
  }
  #hint {
    position: fixed;
    bottom: 14px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: #ffffff88;
    text-align: center;
    padding: 0 12px;
    pointer-events: none;
  }

  /* ---- touch controls (mobile) ---- */
  #dpad {
    position: fixed;
    left: 18px; bottom: 18px;
    width: 132px; height: 132px;
    z-index: 45;
    display: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #dpad button {
    position: absolute;
    width: 44px; height: 44px;
    background: rgba(255,255,255,0.10);
    border: 2px solid rgba(255,255,255,0.35);
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    border-radius: 6px;
    padding: 0;
  }
  #dpad button:active { background: rgba(255,213,128,0.55); }
  #dpad .up    { left: 44px; top: 0; }
  #dpad .down  { left: 44px; top: 88px; }
  #dpad .left  { left: 0;   top: 44px; }
  #dpad .right { left: 88px; top: 44px; }
  body.touch #dpad { display: block; }
  body.touch #hint { display: none; }
  @media (hover: none) {
    #dpad { display: block; }
    #hint { display: none; }
  }

  /* ---- responsive ---- */
  @media (max-width: 820px) {
    .planet { width: 108px; height: 108px; }
    .grad-cap { width: 38px; height: 30px; top: -13px; }
    #education    { top: 6%;  left: 2%; }
    #work         { top: 38%; left: 1%; }
    #volunteering { top: 70%; left: 34%; }
    #projects     { top: 6%;  left: 62%; }
    #hobbies      { top: 38%; left: 62%; }
    #socials      { top: 2%;  left: 39%; width: 84px; height: 66px; }
    #sun { width: 250px; height: 250px; padding: 20px; }
    #sun-hi { font-size: 10px; }
    #sun-name { font-size: 17px; }
    #panel { padding: 20px 16px 16px; }
    #panel h2 { font-size: 11px; line-height: 1.5; }
    #panel p, #panel li { font-size: 12px; line-height: 1.6; }
    #panel .entry-title { font-size: 12px; }
    #focus-prompt { font-size: 8px; padding: 6px 8px; }
  }
  @media (max-width: 460px) {
    .planet { width: 92px; height: 92px; }
    #dpad { width: 120px; height: 120px; left: 12px; bottom: 12px; }
    #dpad button { width: 40px; height: 40px; }
    #dpad .up, #dpad .down { left: 40px; }
    #dpad .left, #dpad .right { top: 40px; }
    #dpad .down { top: 80px; }
    #dpad .right { left: 80px; }
  }
  @media (max-height: 520px) {
    #sun { width: 116px; height: 116px; padding: 6px; }
    #sun-hi { font-size: 7px; margin-bottom: 4px; }
    #sun-name { font-size: 10px; white-space: nowrap; }
    .planet { width: 78px; height: 78px; }
    .grad-cap { width: 30px; height: 24px; top: -10px; }
    #education    { top: 3%;  left: 1%; }
    #work         { top: 40%; left: 1%; }
    #volunteering { top: 66%; left: 38%; }
    #projects     { top: 3%;  left: 86%; }
    #hobbies      { top: 40%; left: 86%; }
    #socials      { top: 2%;  left: 46%; width: 62px; height: 50px; }
    #dpad { width: 100px; height: 100px; left: 10px; bottom: 10px; }
    #dpad button { width: 32px; height: 32px; font-size: 9px; }
    #dpad .up, #dpad .down { left: 34px; }
    #dpad .left, #dpad .right { top: 34px; }
    #dpad .down { top: 68px; }
    #dpad .right { left: 68px; }
  }

  /* ---- welcome / intro modal ---- */
  #welcome-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: radial-gradient(ellipse at center, rgba(21,19,50,0.86) 0%, rgba(5,6,20,0.94) 75%);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  #welcome-overlay.gone { opacity: 0; transform: scale(1.04); pointer-events: none; }
  #welcome {
    position: relative;
    max-width: 440px;
    width: 100%;
    text-align: center;
    color: #ececf6;
    background: #1b1846;
    border: 3px solid #fff;
    padding: 34px 28px 30px;
    box-shadow:
      0 0 0 3px #0a0e27,
      0 0 0 6px #4ecdc4,
      0 0 0 9px #0a0e27,
      0 12px 0 9px rgba(0,0,0,0.45),
      0 0 40px rgba(78,205,196,0.25);
    animation: welcome-pop 0.4s cubic-bezier(0.18, 1.3, 0.4, 1) both;
  }
  @keyframes welcome-pop {
    from { opacity: 0; transform: translateY(10px) scale(0.92); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .w-rocket {
    font-size: 40px;
    line-height: 1;
    margin-bottom: 16px;
    display: inline-block;
    animation: rocket-wiggle 2.4s ease-in-out infinite;
  }
  @keyframes rocket-wiggle {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50%      { transform: translateY(-5px) rotate(4deg); }
  }
  .w-title {
    font-size: 14px;
    line-height: 1.75;
    margin-bottom: 10px;
  }
  .w-note {
    font-size: 11px;
    line-height: 1.7;
    color: #a7a7c8;
    margin: 14px 0 22px;
  }
  .w-note a {
    color: #6be0d6;
    text-decoration: none;
    border-bottom: 1px dotted #6be0d6aa;
  }
  .w-note a:hover { color: #fff; border-bottom-color: #fff; }
  #suit-up {
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    color: #0d2b16;
    background: #6bcf7f;
    border: 3px solid #0a0e27;
    padding: 14px 26px;
    cursor: pointer;
    box-shadow: 0 6px 0 0 #327a41, 0 6px 0 3px #0a0e27;
    transition: transform 0.06s ease, box-shadow 0.06s ease, background 0.15s ease;
  }
  #suit-up:hover { background: #7fe093; }
  #suit-up:active {
    transform: translateY(5px);
    box-shadow: 0 1px 0 0 #327a41, 0 1px 0 3px #0a0e27;
  }
  /* floating decorations around the modal */
  .w-orbit {
    position: absolute;
    font-size: 26px;
    line-height: 1;
    pointer-events: none;
    animation: w-float 4s ease-in-out infinite;
  }
  .w-o1 { top: -20px; left: -22px; animation-delay: -0.5s; }
  .w-o2 { top: -26px; right: -18px; font-size: 22px; animation-delay: -1.6s; }
  .w-o3 { bottom: -20px; right: -16px; font-size: 18px; animation-delay: -2.4s; }
  @keyframes w-float {
    0%, 100% { transform: translateY(0) rotate(-4deg); }

<script>
// Generate starfield
const world = document.getElementById('world');
for (let i = 0; i < 120; i++) {

  star.className = 'star';
  star.style.left = Math.random() * 100 + '%';

  world.insertBefore(star, world.firstChild);

// Build chunky pixel-art planets (pure SVG, no image files).
// Everything is drawn on a 32x32 integer grid so it reads as real pixels.
const GRID = 32, PC = 16, PR = 13;
const PLANET_ART = {
  education: { base:'#3fb8b0', dark:'#1f6b66', light:'#a8f2eb',
    craters:[[9,9,3],[20,19,2.2],[23,12,1.5],[13,7,1.3]] },
  work:      { base:'#f0894a', dark:'#a8481b', light:'#ffd9b8', bands:true,
    craters:[[22,8,2],[10,22,1.6]] },
  projects:  { base:'#5cc36f', dark:'#2f7a41', light:'#c6f5cf', ring:true,
    craters:[[12,11,2.6],[9,19,2],[21,22,1.7]] },
  hobbies:   { base:'#f0608f', dark:'#a82f5c', light:'#ffc0d8',
    craters:[[10,10,2.7],[22,9,1.9],[24,19,1.7],[12,22,1.3]] },
  volunteering: { base:'#b98cf0', dark:'#6f47b0', light:'#e3d2ff',
    craters:[[10,12,2.6],[21,10,2],[22,21,1.8],[13,23,1.3]] }
};
// Collect pixel rows where test(px,py) is true AND the pixel sits inside the disc.
function pxRuns(test, ox) {
  ox = ox || 0;
  let out = '';
  for (let py = 0; py < GRID; py++) {
    let start = -1;
    for (let px = 0; px <= GRID; px++) {
      const inDisc = px < GRID &&
        (px + 0.5 - PC) ** 2 + (py + 0.5 - PC) ** 2 <= PR * PR;
      const on = inDisc && test(px, py);
      if (on && start < 0) start = px;
      if ((!on || px === GRID) && start >= 0) {
        out += `<rect x="${start + ox}" y="${py}" width="${px - start}" height="1"/>`;
        start = -1;
      }
    }
  }
  return out;
}
function fillLayer(test, fill, opacity, ox) {
  const r = pxRuns(test, ox);
  return r ? `<g fill="${fill}"${opacity != null ? ` opacity="${opacity}"` : ''}>${r}</g>` : '';
}
function craterLayer(cfg, ox) {
  let s = '';
  (cfg.craters || []).forEach(([cx, cy, r]) => {
    s += fillLayer((px, py) => (px + 0.5 - cx) ** 2 + (py + 0.5 - cy) ** 2 <= r * r, cfg.dark, null, ox);
    s += fillLayer((px, py) => (px + 0.6 - cx) ** 2 + (py + 0.9 - cy) ** 2 <= Math.max(r - 1.1, 0.4) ** 2, cfg.base, null, ox);
    s += fillLayer((px, py) => (px + 0.5 - (cx - r * 0.4)) ** 2 + (py + 0.5 - (cy - r * 0.4)) ** 2 <= 0.7, cfg.light, 0.55, ox);
  });
  return s;
}
// surface = the part that scrolls sideways to fake rotation
function surface(cfg, ox) {
  let s = fillLayer(() => true, cfg.base, null, ox);
  s += fillLayer((px, py) => (px + 0.5 - (PC - 4)) ** 2 + (py + 0.5 - (PC - 3)) ** 2 <= 20, cfg.light, 0.12, ox);
  if (cfg.bands) {
    s += fillLayer((px, py) => py >= 6 && py < 10, cfg.dark, 0.28, ox);
    s += fillLayer((px, py) => py >= 14 && py < 19, cfg.light, 0.24, ox);
    s += fillLayer((px, py) => py >= 22 && py < 25, cfg.dark, 0.26, ox);
  }
  s += craterLayer(cfg, ox);
  return s;
}
function ringRuns(front, ry) {
  let out = '';
  for (let py = 0; py < GRID; py++) {
    for (let px = -2; px < GRID + 2; px++) {
      const v = ((px + 0.5 - PC) / 16.5) ** 2 + ((py + 0.5 - (PC + 2)) / ry) ** 2;
      if (v > 1 || v < 0.52) continue;
      if (front && py + 0.5 < PC + 2) continue;
      if (!front && py + 0.5 >= PC + 2) continue;
      out += `<rect x="${px}" y="${py}" width="1" height="1"/>`;
    }
  }
  return out;
}
function planetSVG(cfg, id) {
  const clip = 'pclip-' + id;
  return `<svg class="planet-svg" viewBox="0 0 32 32" shape-rendering="crispEdges" aria-hidden="true">
    <defs><clipPath id="${clip}">${pxRuns(() => true)}</clipPath></defs>
    ${cfg.ring ? `<g fill="${cfg.dark}">${ringRuns(false, 3.6)}</g>` : ''}
    <g clip-path="url(#${clip})">
      ${surface(cfg, 0)}
      ${fillLayer((px, py) => (px + 0.5 - (PC + 4)) ** 2 + (py + 0.5 - (PC + 4)) ** 2 > (PR + 1.5) ** 2, '#05010f', 0.32)}
      ${fillLayer((px, py) => {
        const d = (px + 0.5 - (PC - 3)) ** 2 + (py + 0.5 - (PC - 3)) ** 2;
        return d <= PR * PR && d > (PR - 1.6) ** 2;
      }, cfg.light, 0.5)}
    </g>
    ${cfg.ring ? `<g fill="${cfg.light}">${ringRuns(true, 3.6)}</g>` : ''}
  </svg>`;
}
Object.keys(PLANET_ART).forEach(id => {
  document.getElementById(id).insertAdjacentHTML('afterbegin', planetSVG(PLANET_ART[id], id));
});

// Floating decorations — pure eye-candy, no interaction
const deco = document.getElementById('deco');
const DECO_SVG = {
  sat: `<svg width="34" height="20" viewBox="0 0 34 20">
    <g fill="#2b3f6b"><rect x="0" y="6" width="8" height="8"/><rect x="26" y="6" width="8" height="8"/></g>
    <g fill="#5b8dd6"><rect x="1" y="7" width="2" height="6"/><rect x="4" y="7" width="2" height="6"/><rect x="28" y="7" width="2" height="6"/><rect x="31" y="7" width="2" height="6"/></g>
    <rect x="8" y="9" width="18" height="2" fill="#9aa3b2"/>

  </svg>`,
  ufo: `<svg width="34" height="20" viewBox="0 0 34 20">
    <rect x="12" y="2" width="10" height="5" fill="#8be6df"/>
    <rect x="14" y="1" width="6" height="2" fill="#c7fffb"/>
    <rect x="4" y="8" width="26" height="4" fill="#c9cfdb"/>
    <rect x="1" y="10" width="32" height="3" fill="#9aa3b2"/>
    <g fill="#ffd580"><rect x="5" y="13" width="3" height="2"/><rect x="15" y="14" width="3" height="2"/><rect x="25" y="13" width="3" height="2"/></g>
  </svg>`,
  rock: `<svg width="22" height="20" viewBox="0 0 22 20">
    <g fill="#6b6f7a"><rect x="4" y="3" width="12" height="14"/><rect x="2" y="6" width="18" height="8"/><rect x="6" y="1" width="8" height="18"/></g>
    <g fill="#4a4e58"><rect x="7" y="6" width="3" height="3"/><rect x="13" y="10" width="4" height="3"/><rect x="5" y="12" width="3" height="2"/></g>
    <g fill="#8a8e99"><rect x="6" y="3" width="3" height="2"/><rect x="11" y="5" width="2" height="2"/></g>
  </svg>`
};
const DECO_ITEMS = [
  { t:'rock', left:'22%', top:'38%', s:1.1,  dur:26, dx:'18px',  dy:'-14px', spin:true },
  { t:'rock', left:'50%', top:'82%', s:0.7,  dur:22, dx:'-14px', dy:'-10px', spin:true },
  { t:'rock', left:'86%', top:'80%', s:0.9,  dur:30, dx:'12px',  dy:'16px',  spin:true },
  { t:'rock', left:'38%', top:'20%', s:0.55, dur:18, dx:'-10px', dy:'12px',  spin:true },
  { t:'sat',  left:'28%', top:'70%', s:0.9,  dur:24, dx:'22px',  dy:'-8px' },
  { t:'sat',  left:'88%', top:'48%', s:0.7,  dur:30, dx:'-18px', dy:'12px' },
  { t:'ufo',  left:'55%', top:'32%', s:0.85, dur:20, dx:'26px',  dy:'-6px' }
];
DECO_ITEMS.forEach((d, i) => {
  const el = document.createElement('div');
  el.className = 'deco' + (d.spin ? ' spin-slow' : '');
  el.style.left = d.left;
  el.style.top = d.top;
  el.style.setProperty('--dx', d.dx);
  el.style.setProperty('--dy', d.dy);
  el.style.transform = `scale(${d.s})`;
  el.style.animation = `deco-drift ${d.dur}s ease-in-out ${-i * 2}s infinite`;
  el.innerHTML = DECO_SVG[d.t];
  deco.appendChild(el);
});

// Occasional shooting star
function shootingStar() {
  const s = document.createElement('div');
  s.className = 'shoot';
  s.style.left = (10 + Math.random() * 70) + '%';
  s.style.top = (Math.random() * 45) + '%';
  const dist = 220 + Math.random() * 160;
  s.animate([
    { transform: 'translate(0,0)', opacity: 1 },
    { transform: `translate(${dist}px, ${dist * 0.5}px)`, opacity: 0 }
  ], { duration: 700 + Math.random() * 400, easing: 'ease-in' });
  world.appendChild(s);
  setTimeout(() => s.remove(), 1300);
  setTimeout(shootingStar, 4000 + Math.random() * 6000);
}
setTimeout(shootingStar, 3000);

// Astronaut movement
const astro = document.getElementById('astronaut');
const astroInner = document.getElementById('astro-inner');
let x = window.innerWidth / 2 - 22;
let y = window.innerHeight * 0.28;
astro.style.left = x + 'px';
astro.style.top = y + 'px';
let vx = 0, vy = 0;
const MAX_SPEED = 7.2, ACCEL = 1.0, FRICTION = 0.82;
const keys = {};

// Touch: on-screen D-pad
const dpadDir = { up: false, down: false, left: false, right: false };
const IS_TOUCH = window.matchMedia('(hover: none)').matches
  || 'ontouchstart' in window
  || navigator.maxTouchPoints > 0
  || location.search.includes('touch');
if (IS_TOUCH) document.body.classList.add('touch');
document.querySelectorAll('#dpad button').forEach(btn => {
  const d = btn.dataset.dir;
  const set = v => e => { e.preventDefault(); dpadDir[d] = v; };
  btn.addEventListener('touchstart', set(true), { passive: false });
  btn.addEventListener('touchend', set(false));
  btn.addEventListener('touchcancel', set(false));
  btn.addEventListener('mousedown', set(true));
  btn.addEventListener('mouseup', set(false));
  btn.addEventListener('mouseleave', set(false));
});

document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (!gameStarted) {
    if (k === 'enter' || k === ' ') { e.preventDefault(); startJourney(); }
    return;
  }
  keys[k] = true;
  if (k === 'enter' || e.code === 'Enter') {
    e.preventDefault();
    if (focusedId && !panelOpen) openPanel(focusedId);
    else if (panelOpen) closePanel();
  }
  if (k === 'escape' && panelOpen) closePanel();
});
document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

const PROMPT_LABELS = {
  education: 'EDUCATION', work: 'WORK', projects: 'PROJECTS',
  hobbies: 'CCA', volunteering: 'VOLUNTEERING', socials: 'CONTACT'
};
const promptEl = document.getElementById('focus-prompt');
let focusedId = null;

let lastT = performance.now();
function updateAstro(now) {
  now = now || performance.now();
  const dt = Math.min((now - lastT) / 16.67, 2.5);
  lastT = now;

  if (!gameStarted) { requestAnimationFrame(updateAstro); return; }

  let ix = 0, iy = 0;
  if (keys['arrowup'] || keys['w'] || dpadDir.up) iy -= 1;
  if (keys['arrowdown'] || keys['s'] || dpadDir.down) iy += 1;
  if (keys['arrowleft'] || keys['a'] || dpadDir.left) ix -= 1;
  if (keys['arrowright'] || keys['d'] || dpadDir.right) ix += 1;

  if (ix || iy) {
    const len = Math.hypot(ix, iy);
    vx += (ix / len) * ACCEL * dt;
    vy += (iy / len) * ACCEL * dt;
    if (ix < 0) astroInner.classList.add('face-left');
    if (ix > 0) astroInner.classList.remove('face-left');
  }

  const fr = Math.pow(FRICTION, dt);
  vx *= fr; vy *= fr;
  const sp = Math.hypot(vx, vy);
  if (sp > MAX_SPEED) { vx = vx / sp * MAX_SPEED; vy = vy / sp * MAX_SPEED; }
  if (sp < 0.04) { vx = 0; vy = 0; }

  x = Math.max(0, Math.min(window.innerWidth - 44, x + vx * dt));
  y = Math.max(0, Math.min(window.innerHeight - 56, y + vy * dt));
  astro.style.left = x + 'px';
  astro.style.top = y + 'px';
  astro.classList.toggle('walk', Math.hypot(vx, vy) > 0.35);

  updateFocus();
  requestAnimationFrame(updateAstro);
}

function updateFocus() {
  const targets = document.querySelectorAll('.planet, #socials');
  const a = astro.getBoundingClientRect();
  const aX = a.left + a.width / 2, aY = a.top + a.height / 2;
  let near = null, nearD = Infinity, nearRect = null;
  targets.forEach(p => {
    const r = p.getBoundingClientRect();
    const d = Math.hypot(r.left + r.width / 2 - aX, r.top + r.height / 2 - aY);
    if (d < r.width / 2 + 55 && d < nearD) { near = p; nearD = d; nearRect = r; }
  });

  const id = near ? near.id : null;
  if (id !== focusedId) {
    if (focusedId) document.getElementById(focusedId).classList.remove('focused');
    focusedId = id;
    if (near) {
      near.classList.add('focused');
      const what = PROMPT_LABELS[near.id];
      promptEl.innerHTML = document.body.classList.contains('touch')
        ? '<span class="key">&#9670;</span> TAP &mdash; ' + what
        : '<span class="key">&#9670;</span> PRESS ENTER KEY &mdash; ' + what;
      promptEl.classList.toggle('show', !panelOpen);
    } else {
      promptEl.classList.remove('show');
    }
  }
  if (focusedId && !panelOpen && nearRect) {
    promptEl.classList.add('show');
    const half = promptEl.offsetWidth / 2 + 8;
    const cx = Math.max(half, Math.min(window.innerWidth - half, nearRect.left + nearRect.width / 2));
    promptEl.style.left = cx + 'px';
    const below = nearRect.top - 6 < 46;
    promptEl.classList.toggle('below', below);
    promptEl.style.top = (below ? nearRect.bottom + 6 : nearRect.top - 6) + 'px';
  } else if (panelOpen) {
    promptEl.classList.remove('show');
  }
}
